{% extends "base.html" %}
{% block content %}
<div class="space-y-5">
  <div class="flex items-center justify-between gap-4">
    <div>
      <a href="/billing/admin/companies" class="text-sm text-slate-500 hover:underline">← Quay lại danh sách</a>
      <h1 class="text-xl font-semibold text-slate-800 mt-1">Lịch sử cấu hình phí (hợp đồng)</h1>
      <p class="text-sm text-slate-500">Mặc định chỉ hiển thị cấu hình đang active. Bỏ chọn để xem toàn bộ lịch sử.</p>
    </div>
  </div>

  <div class="bg-white border border-slate-200 rounded-xl p-4 flex flex-col md:flex-row gap-3 md:items-end">
    <div class="flex-1">
      <label class="text-xs text-slate-500">Lọc theo mã công ty</label>
      <input id="companyCode" value="{{ init_company_code or '' }}"
             placeholder="Để trống = tất cả"
             class="mt-1 w-full px-3 py-2 rounded-lg border border-slate-300 text-sm font-mono" />
    </div>
    <label class="flex items-center gap-2 text-sm text-slate-700 pb-2">
      <input id="activeOnly" type="checkbox" {% if init_active_only %}checked{% endif %} class="rounded border-slate-300" />
      Chỉ config đang active
    </label>
    <button id="btnLoad" class="px-3 py-2 rounded-lg border border-slate-300 bg-white text-sm hover:bg-slate-50">
      <i class="ri-search-line mr-1"></i> Tải
    </button>
  </div>

  <div class="bg-white border border-slate-200 rounded-xl overflow-hidden">
    <div class="overflow-x-auto">
      <table class="min-w-[1100px] text-sm">
        <thead class="bg-slate-50 text-slate-600">
          <tr>
            <th class="text-left px-4 py-2">ID</th>
            <th class="text-left px-4 py-2">Công ty</th>
            <th class="text-left px-4 py-2">Bắt đầu phí</th>
            <th class="text-right px-4 py-2">Tỷ lệ</th>
            <th class="text-right px-4 py-2">Min / Max</th>
            <th class="text-right px-4 py-2">Cố định/tháng</th>
            <th class="text-center px-4 py-2">Grace</th>
            <th class="text-right px-4 py-2">Setup</th>
            <th class="text-center px-4 py-2">Active</th>
            <th class="text-left px-4 py-2">Cập nhật</th>
          </tr>
        </thead>
        <tbody id="tbody" class="divide-y divide-slate-100">
          <tr><td colspan="10" class="px-4 py-6 text-center text-slate-500">Đang tải...</td></tr>
        </tbody>
      </table>
    </div>
  </div>
</div>

<script>
(function(){
  const money = (v) => Math.round(Number(v||0)).toLocaleString("vi-VN");
  const pct = (v) => (Number(v||0)*100).toFixed(2) + "%";
  const dt = (v) => v ? String(v).slice(0,19).replace("T"," ") : "—";

  async function load(){
    const cc = (document.getElementById("companyCode").value || "").trim();
    const activeOnly = document.getElementById("activeOnly").checked;
    const params = new URLSearchParams();
    if(cc) params.set("company_code", cc);
    params.set("active_only", activeOnly ? "1" : "0");

    const tbody = document.getElementById("tbody");
    tbody.innerHTML = `<tr><td colspan="10" class="px-4 py-6 text-center text-slate-500">Đang tải...</td></tr>`;

    const r = await fetch("/billing/admin/contracts/data?" + params.toString(), { headers: { "Accept": "application/json" }});
    const j = await r.json().catch(() => ({}));
    if(!r.ok){
      tbody.innerHTML = `<tr><td colspan="10" class="px-4 py-6 text-center text-rose-600">Lỗi tải dữ liệu</td></tr>`;
      return;
    }
    const rows = j.data || [];
    if(!rows.length){
      tbody.innerHTML = `<tr><td colspan="10" class="px-4 py-6 text-center text-slate-500">Không có dữ liệu</td></tr>`;
      return;
    }
    tbody.innerHTML = rows.map(x => {
      const cc = x.company_code || "";
      const configUrl = `/account/company/${encodeURIComponent(cc)}/billing-fees`;
      const active = x.is_active
        ? `<span class="px-2 py-0.5 rounded-full text-xs bg-emerald-50 text-emerald-700 border border-emerald-200">ACTIVE</span>`
        : `<span class="px-2 py-0.5 rounded-full text-xs bg-slate-50 text-slate-600">—</span>`;
      return `
        <tr class="hover:bg-slate-50">
          <td class="px-4 py-2 font-mono text-slate-600">${x.id}</td>
          <td class="px-4 py-2"><a class="text-indigo-600 hover:underline font-mono" href="${configUrl}">${cc}</a></td>
          <td class="px-4 py-2">${String(x.billing_start_at||"").slice(0,10)}</td>
          <td class="px-4 py-2 text-right">${pct(x.revenue_percent)}</td>
          <td class="px-4 py-2 text-right text-xs">${money(x.percent_min)} / ${money(x.percent_max)}</td>
          <td class="px-4 py-2 text-right">${money(x.monthly_fixed_fee)}</td>
          <td class="px-4 py-2 text-center">${x.grace_days ?? "—"}</td>
          <td class="px-4 py-2 text-right">${money(x.setup_fee)}</td>
          <td class="px-4 py-2 text-center">${active}</td>
          <td class="px-4 py-2 text-xs text-slate-500">${dt(x.updated_at || x.created_at)}</td>
        </tr>
      `;
    }).join("");
  }

  document.getElementById("btnLoad").addEventListener("click", load);
  document.getElementById("companyCode").addEventListener("keydown", (e) => {
    if(e.key === "Enter") load();
  });
  load();
})();
</script>
{% endblock %}
