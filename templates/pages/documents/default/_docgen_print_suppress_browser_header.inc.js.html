<script>
(function () {
  var savedTitle = null;
  window.addEventListener('beforeprint', function () {
    savedTitle = document.title;
    document.title = '\u00A0';
  });
  window.addEventListener('afterprint', function () {
    if (savedTitle != null) {
      document.title = savedTitle;
      savedTitle = null;
    }
  });
})();
</script>
