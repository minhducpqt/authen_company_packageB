<!doctype html>
<html lang="vi">
<head>
  <meta charset="utf-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1"/>
  <title>{{ title or "Trình chiếu kết quả trúng đấu giá" }}</title>
  <style>
    :root{
      --bg:#071018;
      --ink:#f6f1e6;
      --muted:#b7c0cc;
      --gold:#e7c27a;
      --line:rgba(231,194,122,.28);
      --card:#101a28;
      --font:"Segoe UI",system-ui,-apple-system,"Helvetica Neue",Arial,sans-serif;
    }
    *{box-sizing:border-box}
    html,body{height:100%;margin:0;overflow:hidden;background:var(--bg);color:var(--ink)}
    body{font-family:var(--font)}
    button,input{font-family:inherit;color:inherit}
    button{cursor:pointer}
    button:focus-visible,input:focus-visible{outline:2px solid var(--gold);outline-offset:2px}
    .stage{
      height:100vh;height:100dvh;
      display:flex;flex-direction:column;
      padding:22px 28px 14px;gap:14px;
      background:
        radial-gradient(900px 420px at 50% -10%, rgba(231,194,122,.16), transparent 60%),
        linear-gradient(180deg, #0c1826, var(--bg) 42%);
    }
    .header{
      display:flex;align-items:flex-end;justify-content:space-between;gap:20px;
      min-height:64px;
    }
    .kicker{
      color:var(--gold);letter-spacing:.28em;font-size:13px;font-weight:800;
    }
    h1{
      margin:4px 0 0;font-size:clamp(26px, 3vw, 40px);font-weight:800;letter-spacing:.04em;
    }
    .project{
      margin-top:4px;color:var(--muted);font-size:16px;font-weight:650;
      max-width:70vw;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;
    }
    .live{
      text-align:right;color:var(--muted);font-size:13px;font-weight:700;
    }
    .live b{color:var(--ink);font-weight:800}
    .dot{
      display:inline-block;width:8px;height:8px;border-radius:99px;margin-right:6px;
      background:#34d399;box-shadow:0 0 10px rgba(52,211,153,.7);
    }
    .dot.warn{background:#fbbf24;box-shadow:none}
    .dot.bad{background:#fb7185;box-shadow:none}
    .board{
      flex:1 1 auto;min-height:0;
      display:grid;gap:14px;
    }
    .card{
      min-width:0;min-height:0;
      border:1px solid var(--line);
      border-radius:18px;
      background:linear-gradient(180deg, rgba(255,255,255,.04), rgba(0,0,0,.18));
      padding:16px 18px 14px;
      display:flex;flex-direction:column;justify-content:space-between;
      box-shadow:0 16px 40px rgba(0,0,0,.28);
    }
    .lot{
      color:var(--gold);font-weight:850;letter-spacing:.08em;
      font-size:clamp(18px, 2vw, 28px);
    }
    .who{margin-top:8px;font-weight:800;line-height:1.15;font-size:clamp(22px, 2.6vw, 40px)}
    .cccd{
      margin-top:6px;color:var(--muted);letter-spacing:.18em;
      font-size:clamp(16px, 1.6vw, 24px);font-weight:750;
    }
    .price{
      margin-top:10px;font-weight:850;letter-spacing:.02em;
      font-size:clamp(26px, 3vw, 48px);color:#fff;
    }
    .price span{font-size:.42em;letter-spacing:.12em;color:var(--gold);margin-left:8px;font-weight:800}
    .empty{
      margin:auto;text-align:center;color:var(--muted);font-size:22px;font-weight:700;
    }
    .footer{
      display:flex;align-items:center;justify-content:space-between;gap:12px;
      padding-top:4px;
    }
    .nav,.tune{display:flex;align-items:center;gap:8px;min-width:0}
    .icon,.chip,.auto{
      border:1px solid rgba(231,194,122,.35);
      background:rgba(255,255,255,.04);
      color:var(--ink);
      border-radius:12px;
      min-height:40px;
    }
    .icon{
      width:42px;display:grid;place-items:center;padding:0;
    }
    .icon svg{width:18px;height:18px}
    .icon:disabled{opacity:.35;cursor:default}
    .page-label{min-width:148px;text-align:center;font-weight:800;letter-spacing:.08em;font-size:13px}
    .bar{height:3px;margin-top:4px;background:rgba(255,255,255,.12);border-radius:99px;overflow:hidden}
    .bar > span{display:block;height:100%;width:0;background:var(--gold)}
    .auto{padding:0 12px;font-weight:850;letter-spacing:.08em}
    .auto.on{background:var(--gold);color:#1b1408;border-color:var(--gold)}
    .tune label{color:var(--muted);font-size:12px;font-weight:750;display:flex;align-items:center;gap:6px}
    .tune input{
      width:58px;background:#0c1622;border:1px solid var(--line);border-radius:10px;
      padding:8px 6px;text-align:center;font-weight:800;
    }
    .step{
      width:32px;height:32px;border-radius:10px;border:1px solid var(--line);
      background:transparent;font-size:18px;line-height:1;
    }
    .sizes{display:flex;gap:4px}
    .sizes button{
      min-width:36px;height:32px;border-radius:10px;border:1px solid var(--line);
      background:transparent;font-weight:800;
    }
    .sizes button.on{background:var(--gold);color:#1b1408;border-color:var(--gold)}
    .full{
      border:1px solid var(--line);background:transparent;border-radius:12px;
      min-height:40px;padding:0 12px;font-weight:750;
    }
  </style>
</head>
<body>
  <div class="stage">
    <header class="header">
      <div>
        <div class="kicker">KẾT QUẢ TRÚNG ĐẤU GIÁ</div>
        <h1 id="projectTitle">{{ project_name or project or "Chưa chọn dự án" }}</h1>
        <div class="project" id="projectCode">{{ project or "" }}</div>
      </div>
      <div class="live"><span class="dot" id="dot"></span><span id="liveText">Đang tải</span><div>Cập nhật <b id="updated">—</b></div></div>
    </header>
    <section class="board" id="board"></section>
    <footer class="footer">
      <div class="nav">
        <button class="icon" type="button" id="btnPrev" aria-label="Trang trước">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><path d="M15 5 8 12l7 7"/></svg>
        </button>
        <div>
          <div class="page-label" id="pageLabel">TRANG 01 / 01</div>
          <div class="bar"><span id="pageFill"></span></div>
        </div>
        <button class="icon" type="button" id="btnNext" aria-label="Trang sau">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><path d="M9 5l7 7-7 7"/></svg>
        </button>
        <button class="auto on" type="button" id="btnAuto" aria-pressed="true">AUTO ON</button>
      </div>
      <div class="tune">
        <label>Giây / trang
          <button class="step" type="button" id="secDown" aria-label="Giảm thời gian">−</button>
          <input id="seconds" type="number" min="3" max="60" value="12">
          <button class="step" type="button" id="secUp" aria-label="Tăng thời gian">+</button>
        </label>
        <label>Số lô / trang
          <span class="sizes" id="sizes">
            <button type="button" data-n="4">4</button>
            <button type="button" data-n="6">6</button>
            <button type="button" data-n="8">8</button>
            <button type="button" data-n="12">12</button>
          </span>
        </label>
        <button class="full" type="button" id="btnFull">Toàn màn hình</button>
      </div>
    </footer>
  </div>
<script>
  const PROJECT_ID = {{ project_id or "null" }};
  const POLL_MS = 5000;
  const PAGE_SIZES = [4, 6, 8, 12];
  const storeKey = "results-present:" + String(PROJECT_ID || "none");

  const board = document.getElementById("board");
  const pageLabel = document.getElementById("pageLabel");
  const pageFill = document.getElementById("pageFill");
  const btnAuto = document.getElementById("btnAuto");
  const secondsInput = document.getElementById("seconds");
  const sizeButtons = Array.from(document.querySelectorAll("#sizes button"));

  let rows = [];
  let pageIndex = 0;
  let perPage = 6;
  let seconds = 12;
  let autoOn = true;
  let pageStarted = performance.now();
  let polling = false;

  function loadConfig(){
    try{
      const raw = JSON.parse(localStorage.getItem(storeKey) || "{}");
      if(PAGE_SIZES.indexOf(Number(raw.perPage)) >= 0) perPage = Number(raw.perPage);
      const sec = Number(raw.seconds);
      if(sec >= 3 && sec <= 60) seconds = sec;
      if(typeof raw.autoOn === "boolean") autoOn = raw.autoOn;
    }catch(e){}
    secondsInput.value = String(seconds);
    paintAuto();
    paintSizes();
  }
  function saveConfig(){
    try{
      localStorage.setItem(storeKey, JSON.stringify({ perPage, seconds, autoOn }));
    }catch(e){}
  }
  function paintAuto(){
    btnAuto.classList.toggle("on", autoOn);
    btnAuto.textContent = autoOn ? "AUTO ON" : "AUTO OFF";
    btnAuto.setAttribute("aria-pressed", autoOn ? "true" : "false");
  }
  function paintSizes(){
    sizeButtons.forEach(btn => btn.classList.toggle("on", Number(btn.dataset.n) === perPage));
  }
  function digits(v){ return String(v ?? "").replace(/\D/g, ""); }
  function money(v){
    const d = digits(v).replace(/^0+(?=\d)/, "");
    if(!d) return "—";
    let out = "";
    let n = 0;
    for(let i = d.length - 1; i >= 0; i--){
      out = d[i] + out;
      n++;
      if(n % 3 === 0 && i !== 0) out = "." + out;
    }
    return out;
  }
  function maskCccd(v){
    const d = digits(v);
    if(!d) return "—";
    return "***" + d.slice(-3);
  }
  function esc(s){
    return String(s ?? "")
      .replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;")
      .replace(/"/g,"&quot;");
  }
  function pageCount(){
    return Math.max(1, Math.ceil(rows.length / perPage));
  }
  function gridStyle(n){
    let cols = 2;
    if(n > 4 && n <= 6) cols = 3;
    else if(n > 6 && n <= 8) cols = 4;
    else if(n > 8) cols = 4;
    const rowsN = Math.ceil(n / cols);
    return `grid-template-columns:repeat(${cols}, minmax(0,1fr));grid-template-rows:repeat(${rowsN}, minmax(0,1fr));`;
  }
  function render(){
    const pages = pageCount();
    if(pageIndex >= pages) pageIndex = pages - 1;
    if(pageIndex < 0) pageIndex = 0;
    const slice = rows.slice(pageIndex * perPage, pageIndex * perPage + perPage);
    pageLabel.textContent = "TRANG " + String(pageIndex + 1).padStart(2,"0") + " / " + String(pages).padStart(2,"0");
    if(!slice.length){
      board.style.cssText = "display:flex;";
      board.innerHTML = '<div class="empty">Chưa có kết quả trúng.</div>';
      return;
    }
    board.style.cssText = gridStyle(slice.length);
    board.innerHTML = slice.map(r => `
      <article class="card">
        <div>
          <div class="lot">${esc(r.lot_code || "—")}</div>
          <div class="who">${esc(r.winner_name || "—")}</div>
          <div class="cccd">${esc(maskCccd(r.winner_cccd))}</div>
        </div>
        <div class="price">${esc(money(r.winning_price_vnd))}<span>VNĐ</span></div>
      </article>
    `).join("");
  }
  function go(delta){
    const pages = pageCount();
    pageIndex = (pageIndex + delta + pages) % pages;
    pageStarted = performance.now();
    render();
  }
  async function loadAll(){
    if(!PROJECT_ID || polling) return;
    polling = true;
    const dot = document.getElementById("dot");
    const live = document.getElementById("liveText");
    try{
      const all = [];
      let page = 1;
      let total = 0;
      do{
        const url = `/auction/results/api/projects/${PROJECT_ID}/lots?page=${page}&size=500&result_status=WON`;
        const res = await fetch(url, { headers: { "Accept":"application/json" } });
        const js = await res.json().catch(() => ({}));
        if(!res.ok) throw new Error("http");
        const chunk = Array.isArray(js.data) ? js.data : [];
        total = Number(js.total || chunk.length || 0);
        all.push.apply(all, chunk);
        page += 1;
        if(!chunk.length) break;
      }while(all.length < total && page < 20);
      all.sort((a, b) => Number(a.lot_id || 0) - Number(b.lot_id || 0));
      const next = all.filter(r => String(r.result_status || "").toUpperCase() === "WON" || r.winner_name);
      const same = JSON.stringify(next.map(r => [r.lot_id, r.winner_name, r.winning_price_vnd, maskCccd(r.winner_cccd)]))
        === JSON.stringify(rows.map(r => [r.lot_id, r.winner_name, r.winning_price_vnd, maskCccd(r.winner_cccd)]));
      rows = next;
      if(!same) render();
      dot.className = "dot";
      live.textContent = "Đang chiếu";
      const d = new Date();
      const p = n => String(n).padStart(2,"0");
      document.getElementById("updated").textContent = `${p(d.getHours())}:${p(d.getMinutes())}:${p(d.getSeconds())}`;
    }catch(e){
      dot.className = "dot warn";
      live.textContent = "Mất kết nối";
    }finally{
      polling = false;
    }
  }
  function frame(now){
    const pages = pageCount();
    if(!autoOn || pages < 2){
      pageFill.style.width = "100%";
    }else{
      const elapsed = now - pageStarted;
      const limit = seconds * 1000;
      if(elapsed >= limit) go(1);
      else pageFill.style.width = Math.min(100, elapsed / limit * 100) + "%";
    }
    requestAnimationFrame(frame);
  }

  document.getElementById("btnPrev").addEventListener("click", () => go(-1));
  document.getElementById("btnNext").addEventListener("click", () => go(1));
  btnAuto.addEventListener("click", () => {
    autoOn = !autoOn;
    pageStarted = performance.now();
    paintAuto();
    saveConfig();
  });
  function setSeconds(v){
    seconds = Math.max(3, Math.min(60, Number(v) || 12));
    secondsInput.value = String(seconds);
    pageStarted = performance.now();
    saveConfig();
  }
  document.getElementById("secDown").addEventListener("click", () => setSeconds(seconds - 1));
  document.getElementById("secUp").addEventListener("click", () => setSeconds(seconds + 1));
  secondsInput.addEventListener("change", () => setSeconds(secondsInput.value));
  sizeButtons.forEach(btn => btn.addEventListener("click", () => {
    perPage = Number(btn.dataset.n);
    pageIndex = 0;
    pageStarted = performance.now();
    paintSizes();
    saveConfig();
    render();
  }));
  document.getElementById("btnFull").addEventListener("click", async () => {
    if(!document.fullscreenElement){
      try{ await document.documentElement.requestFullscreen(); }catch(e){}
    }else{
      try{ await document.exitFullscreen(); }catch(e){}
    }
  });

  loadConfig();
  render();
  loadAll();
  setInterval(loadAll, POLL_MS);
  requestAnimationFrame(frame);
</script>
</body>
</html>
