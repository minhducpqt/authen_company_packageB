<!doctype html>
<html lang="vi">
<head>
  <meta charset="utf-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1"/>
  <title>{{ title or "Trình chiếu kết quả trúng đấu giá" }}</title>
  <style>
    :root{
      --bg:#101216;
      --ink:#f5f7fa;
      --muted:#c9d0da;
      --line:rgba(210,216,224,.42);
      --card:#1b2028;
      --band:#12151b;
      --font:"Segoe UI",system-ui,-apple-system,"Helvetica Neue",Arial,sans-serif;
    }
    *{box-sizing:border-box}
    html,body{height:100%;margin:0;overflow:hidden;background:var(--bg);color:var(--ink)}
    body{font-family:var(--font)}
    button,input{font-family:inherit;color:inherit}
    button{cursor:pointer}
    button:focus-visible,input:focus-visible{outline:2px solid var(--ink);outline-offset:2px}
    .stage{
      height:100vh;height:100dvh;
      display:flex;flex-direction:column;
      padding:22px 36px 16px;
      gap:16px;
      background:
        radial-gradient(1100px 420px at 50% -8%, rgba(255,255,255,.05), transparent 62%),
        linear-gradient(180deg, #1a1f28 0%, var(--bg) 42%);
    }
    .frame{
      flex:1 1 auto;min-height:0;
      display:flex;flex-direction:column;gap:16px;
      border:1px solid var(--line);
      box-shadow:inset 0 0 0 5px var(--bg), inset 0 0 0 6px rgba(210,216,224,.2);
      padding:18px 22px 16px;
    }
    .header{
      display:grid;
      grid-template-columns:minmax(0,1fr) auto;
      align-items:center;
      gap:28px;
      padding-bottom:12px;
      border-bottom:1px solid var(--line);
      position:relative;
    }
    .header:after{
      content:"";
      position:absolute;left:0;right:0;bottom:-5px;height:1px;
      background:rgba(245,247,250,.55);
    }
    .titles{display:flex;align-items:baseline;gap:18px;min-width:0}
    h1{
      margin:0;
      font-size:clamp(26px, 2.6vw, 40px);
      font-weight:750;
      letter-spacing:.06em;
      line-height:1;
      white-space:nowrap;
    }
    .code{
      color:var(--ink);
      font-size:clamp(22px, 2.2vw, 34px);
      font-weight:750;
      letter-spacing:.14em;
      line-height:1;
      white-space:nowrap;
    }
    .plaque{
      min-width:148px;
      text-align:right;
      padding-left:22px;
      border-left:1px solid var(--line);
    }
    .plaque b{
      display:block;
      font-size:clamp(36px, 4vw, 58px);
      font-weight:750;
      line-height:.9;
      letter-spacing:.02em;
      font-variant-numeric:tabular-nums;
      color:var(--ink);
    }
    .plaque span{
      display:block;margin-top:6px;
      color:var(--muted);font-size:12px;font-weight:750;letter-spacing:.2em;
    }
    .board{
      flex:1 1 auto;min-height:0;
      display:grid;gap:12px;
    }
    .card{
      min-width:0;min-height:0;
      display:flex;flex-direction:column;
      background:linear-gradient(180deg, rgba(255,255,255,.05), rgba(255,255,255,0) 42%), var(--card);
      border:1px solid rgba(210,216,224,.28);
      border-top:2px solid rgba(245,247,250,.72);
      overflow:hidden;
      animation:rise .42s ease both;
    }
    .card-body{
      flex:1 1 auto;min-height:0;
      display:flex;flex-direction:column;justify-content:center;
      padding:14px 18px 10px;
    }
    .card-top{display:flex;align-items:baseline;justify-content:space-between;gap:12px}
    .lot{
      color:var(--ink);font-weight:800;letter-spacing:.04em;
      font-size:clamp(30px, 3vw, 46px);line-height:1;
      white-space:nowrap;overflow:hidden;text-overflow:ellipsis;
    }
    .seal{
      flex:0 0 auto;
      color:var(--ink);
      border:1px solid var(--line);
      padding:4px 8px;
      font-size:11px;font-weight:800;letter-spacing:.16em;
    }
    .who{
      margin-top:8px;
      color:var(--ink);
      font-weight:750;
      line-height:1.12;
      letter-spacing:.01em;
      display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden;
    }
    .cccd{
      margin-top:8px;
      display:flex;align-items:baseline;gap:10px;
      color:var(--muted);
      letter-spacing:.16em;
      font-weight:700;
      font-variant-numeric:tabular-nums;
    }
    .cccd .label{font-size:.72em;letter-spacing:.18em}
    .cccd .tail{color:var(--ink);letter-spacing:.22em}
    .price-band{
      flex:0 0 auto;
      display:flex;align-items:baseline;justify-content:space-between;gap:12px;
      padding:10px 18px 12px;
      background:var(--band);
      border-top:1px solid rgba(210,216,224,.28);
    }
    .price-kicker{
      color:var(--muted);font-size:12px;font-weight:750;letter-spacing:.16em;white-space:nowrap;
    }
    .price{
      color:var(--ink);
      font-weight:750;letter-spacing:.01em;line-height:1;
      font-variant-numeric:tabular-nums;font-feature-settings:"tnum" 1;
      white-space:nowrap;
    }
    .price span{
      font-size:.42em;letter-spacing:.14em;color:var(--muted);margin-left:8px;font-weight:750;
    }
    .d4 .lot{font-size:clamp(36px, 3.6vw, 56px)}
    .d4 .who{font-size:clamp(32px, 3.2vw, 52px)}
    .d4 .cccd{font-size:clamp(18px, 1.6vw, 26px)}
    .d4 .price{font-size:clamp(28px, 2.8vw, 46px)}
    .d6 .lot{font-size:clamp(30px, 2.8vw, 42px)}
    .d6 .who{font-size:clamp(26px, 2.3vw, 38px)}
    .d6 .cccd{font-size:clamp(16px, 1.3vw, 22px)}
    .d6 .price{font-size:clamp(22px, 2.1vw, 34px)}
    .d8 .lot{font-size:clamp(26px, 2.3vw, 34px)}
    .d8 .who{font-size:clamp(22px, 1.8vw, 30px)}
    .d8 .cccd{font-size:clamp(14px, 1.1vw, 18px)}
    .d8 .price{font-size:clamp(18px, 1.6vw, 26px)}
    .d8 .seal{display:none}
    .d12 .who{font-size:clamp(18px, 1.35vw, 24px)}
    .d12 .cccd{font-size:clamp(13px, 1vw, 16px);margin-top:4px}
    .d12 .price{font-size:clamp(16px, 1.3vw, 22px)}
    .d12 .lot{font-size:clamp(22px, 1.9vw, 28px)}
    .d12 .seal,.d12 .price-kicker{display:none}
    .d12 .card-body{padding:10px 14px 6px}
    .d12 .price-band{padding:8px 14px}
    .d16 .who{font-size:clamp(16px, 1.15vw, 20px)}
    .d16 .cccd{font-size:clamp(12px, .9vw, 15px);margin-top:2px}
    .d16 .price{font-size:clamp(14px, 1.05vw, 18px)}
    .d16 .lot{font-size:clamp(18px, 1.55vw, 24px)}
    .d16 .seal,.d16 .price-kicker{display:none}
    .d16 .card-body{padding:8px 12px 4px}
    .d16 .price-band{padding:6px 12px}
    .d20,.d24,.d30{gap:8px}
    .d20 .who,.d24 .who,.d30 .who{-webkit-line-clamp:1}
    .d20 .who{font-size:clamp(15px, 1vw, 18px)}
    .d20 .cccd{font-size:clamp(12px, .85vw, 14px);margin-top:2px;letter-spacing:.08em}
    .d20 .price{font-size:clamp(13px, .95vw, 17px)}
    .d20 .lot{font-size:clamp(17px, 1.35vw, 22px);letter-spacing:.03em}
    .d24 .who,.d30 .who{font-size:clamp(13px, .9vw, 16px);margin-top:4px}
    .d24 .cccd,.d30 .cccd{font-size:12px;margin-top:2px;letter-spacing:.06em}
    .d24 .price{font-size:clamp(12px, .85vw, 15px)}
    .d30 .price{font-size:12px}
    .d24 .lot{font-size:clamp(16px, 1.2vw, 20px);letter-spacing:.02em}
    .d30 .lot{font-size:clamp(15px, 1.1vw, 18px);letter-spacing:.02em}
    .d20 .seal,.d24 .seal,.d30 .seal,.d20 .price-kicker,.d24 .price-kicker,.d30 .price-kicker{display:none}
    .d20 .card-body,.d24 .card-body,.d30 .card-body{padding:6px 10px 4px}
    .d20 .price-band,.d24 .price-band,.d30 .price-band{padding:5px 10px}
    .d24 .price span,.d30 .price span{margin-left:4px}
    .empty{
      margin:auto;text-align:center;
    }
    .empty b{
      display:block;font-size:clamp(26px, 3vw, 40px);font-weight:750;letter-spacing:.08em;
    }
    .empty span{display:block;margin-top:8px;color:var(--muted);font-size:18px;font-weight:650}
    .footer{
      height:36px;flex:0 0 36px;
      display:grid;grid-template-columns:minmax(0,1fr) auto minmax(0,1fr);
      align-items:center;gap:16px;
      color:var(--muted);font-size:14px;font-weight:650;
    }
    .foot-left,.foot-right{display:flex;align-items:center;gap:10px;min-width:0}
    .foot-right{justify-content:flex-end}
    .dot{width:8px;height:8px;border-radius:50%;background:#3DDC84;flex:0 0 auto}
    .dot.warn{background:#d0d6de}
    .dot.bad{background:#fb7185}
    .conn{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
    .page-nav{display:flex;align-items:center;gap:10px}
    .page-stack{display:flex;flex-direction:column;align-items:center;gap:5px}
    .page-label{letter-spacing:.08em;font-size:13px;font-weight:750;color:var(--ink)}
    .bar{width:148px;height:3px;background:rgba(255,255,255,.12);border-radius:99px;overflow:hidden}
    .bar > span{display:block;height:100%;width:0;background:var(--ink)}
    .btn{
      height:30px;padding:0 10px;
      display:inline-flex;align-items:center;justify-content:center;gap:6px;
      background:transparent;border:1px solid var(--line);border-radius:2px;
      color:var(--ink);font-size:12px;font-weight:750;letter-spacing:.06em;
    }
    .btn svg{width:15px;height:15px;display:block}
    .btn.icon{width:30px;padding:0}
    .btn:disabled{opacity:.35;cursor:default}
    .btn.on{background:var(--ink);color:#101216;border-color:var(--ink)}
    .overlay{
      position:fixed;inset:0;z-index:20;display:none;
      justify-content:flex-end;background:rgba(16,18,22,.4);
    }
    .overlay.open{display:flex}
    .drawer{
      width:min(420px, 100%);height:100%;
      background:#161a21;
      border-left:1px solid var(--line);
      padding:28px 24px;
      display:flex;flex-direction:column;gap:18px;
    }
    .drawer h2{
      margin:0;font-size:12px;letter-spacing:.2em;color:var(--ink);font-weight:750;
    }
    .field{display:flex;align-items:center;justify-content:space-between;gap:12px;color:var(--muted);font-size:15px;font-weight:650}
    .stepper{display:inline-flex;align-items:center;gap:6px}
    .stepper input{
      width:72px;height:42px;text-align:center;font-size:20px;font-weight:750;
      background:#101216;border:1px solid var(--line);border-radius:2px;color:var(--ink);
    }
    .stepper button,.sizes button{
      height:42px;min-width:42px;
      background:transparent;border:1px solid var(--line);border-radius:2px;
      font-size:18px;font-weight:750;
    }
    .sizes{display:flex;flex-wrap:wrap;gap:8px;justify-content:flex-end;max-width:250px}
    .sizes button.on{background:var(--ink);color:#101216;border-color:var(--ink)}
    .hint{color:var(--muted);font-size:13px;line-height:1.45;margin:0}
    @keyframes rise{
      from{opacity:0;transform:translateY(10px)}
      to{opacity:1;transform:none}
    }
    @media (prefers-reduced-motion:reduce){
      .card{animation:none}
    }
    @media (max-height:820px){
      .stage{padding:14px 22px 10px;gap:10px}
      .frame{padding:12px 14px;gap:10px}
      h1{font-size:clamp(22px, 2.6vw, 34px)}
      .plaque b{font-size:36px}
    }
  </style>
</head>
<body>
  <div class="stage">
    <div class="frame">
      <header class="header">
        <div class="titles">
          <h1>KẾT QUẢ TRÚNG ĐẤU GIÁ</h1>
          <div class="code">{{ project or "" }}</div>
        </div>
        <div class="plaque">
          <b id="wonCount">0</b>
          <span>LÔ TRÚNG</span>
        </div>
      </header>
      <section class="board d6" id="board"></section>
    </div>
    <footer class="footer">
      <div class="foot-left">
        <span class="dot" id="dot"></span>
        <span class="conn" id="liveText">Đang tải</span>
      </div>
      <div class="page-nav">
        <button class="btn icon" type="button" id="btnPrev" aria-label="Trang trước">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><path d="M15 5 8 12l7 7"/></svg>
        </button>
        <div class="page-stack">
          <div class="page-label" id="pageLabel">TRANG 01 / 01</div>
          <div class="bar"><span id="pageFill"></span></div>
        </div>
        <button class="btn icon" type="button" id="btnNext" aria-label="Trang sau">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><path d="M9 5l7 7-7 7"/></svg>
        </button>
        <button class="btn on" type="button" id="btnAuto" aria-pressed="true">TỰ CHUYỂN</button>
      </div>
      <div class="foot-right">
        <button class="btn" type="button" id="btnControls">Điều khiển</button>
        <button class="btn icon" type="button" id="btnFull" aria-label="Toàn màn hình">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><path d="M8 4H4v4M16 4h4v4M4 16v4h4M20 16v4h-4"/></svg>
        </button>
      </div>
    </footer>
  </div>

  <div class="overlay" id="overlay">
    <div class="drawer" id="drawer" role="dialog" aria-label="Điều khiển trình chiếu">
      <h2>TRANG CHIẾU</h2>
      <label class="field">Giây mỗi trang
        <span class="stepper">
          <button type="button" id="secDown" aria-label="Giảm thời gian">−</button>
          <input id="seconds" type="number" min="3" max="60" value="12">
          <button type="button" id="secUp" aria-label="Tăng thời gian">+</button>
        </span>
      </label>
      <div class="field">Số lô mỗi trang
        <span class="sizes" id="sizes">
          <button type="button" data-n="4">4</button>
          <button type="button" data-n="6">6</button>
          <button type="button" data-n="8">8</button>
          <button type="button" data-n="12">12</button>
          <button type="button" data-n="16">16</button>
          <button type="button" data-n="20">20</button>
          <button type="button" data-n="24">24</button>
          <button type="button" data-n="30">30</button>
        </span>
      </div>
      <p class="hint">4 lô cho hội trường rộng. 16 đến 30 lô khi cần xem nhiều hơn trên một trang. Kết quả được cập nhật mỗi 5 giây và vẫn giữ trang đang chiếu.</p>
    </div>
  </div>
<script>
  const PROJECT_ID = {{ project_id or "null" }};
  const POLL_MS = 5000;
  const PAGE_SIZES = [4, 6, 8, 12, 16, 20, 24, 30];
  const storeKey = "results-present:" + String(PROJECT_ID || "none");

  const board = document.getElementById("board");
  const pageLabel = document.getElementById("pageLabel");
  const pageFill = document.getElementById("pageFill");
  const btnAuto = document.getElementById("btnAuto");
  const secondsInput = document.getElementById("seconds");
  const sizeButtons = Array.from(document.querySelectorAll("#sizes button"));
  const overlay = document.getElementById("overlay");
  const wonCount = document.getElementById("wonCount");

  let rows = [];
  let pageIndex = 0;
  let perPage = 6;
  let seconds = 12;
  let autoOn = true;
  let pageStarted = performance.now();
  let polling = false;

  function loadConfig(){
    try{
      const raw = JSON.parse(localStorage.getItem(storeKey) || "{}");
      if(PAGE_SIZES.indexOf(Number(raw.perPage)) >= 0) perPage = Number(raw.perPage);
      const sec = Number(raw.seconds);
      if(sec >= 3 && sec <= 60) seconds = sec;
      if(typeof raw.autoOn === "boolean") autoOn = raw.autoOn;
    }catch(e){}
    secondsInput.value = String(seconds);
    paintAuto();
    paintSizes();
  }
  function saveConfig(){
    try{
      localStorage.setItem(storeKey, JSON.stringify({ perPage, seconds, autoOn }));
    }catch(e){}
  }
  function paintAuto(){
    btnAuto.classList.toggle("on", autoOn);
    btnAuto.textContent = autoOn ? "TỰ CHUYỂN" : "DỪNG TRANG";
    btnAuto.setAttribute("aria-pressed", autoOn ? "true" : "false");
  }
  function paintSizes(){
    sizeButtons.forEach(btn => btn.classList.toggle("on", Number(btn.dataset.n) === perPage));
    board.className = "board d" + perPage;
  }
  function digits(v){ return String(v ?? "").replace(/\D/g, ""); }
  function money(v){
    const d = digits(v).replace(/^0+(?=\d)/, "");
    if(!d) return "—";
    let out = "";
    let n = 0;
    for(let i = d.length - 1; i >= 0; i--){
      out = d[i] + out;
      n++;
      if(n % 3 === 0 && i !== 0) out = "." + out;
    }
    return out;
  }
  function maskParts(v){
    const d = digits(v);
    if(!d) return { stars: "", tail: "—" };
    return { stars: "***", tail: d.slice(-3) };
  }
  function esc(s){
    return String(s ?? "")
      .replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;")
      .replace(/"/g,"&quot;");
  }
  function pageCount(){
    return Math.max(1, Math.ceil(rows.length / perPage));
  }
  function gridStyle(n){
    let cols = 2;
    if(perPage <= 4) cols = 2;
    else if(perPage <= 6) cols = 3;
    else if(perPage <= 16) cols = 4;
    else if(perPage <= 20) cols = 5;
    else cols = 6;
    const rowsN = Math.ceil(n / cols);
    return `grid-template-columns:repeat(${cols}, minmax(0,1fr));grid-template-rows:repeat(${rowsN}, minmax(0,1fr));`;
  }
  function render(){
    const pages = pageCount();
    if(pageIndex >= pages) pageIndex = pages - 1;
    if(pageIndex < 0) pageIndex = 0;
    const slice = rows.slice(pageIndex * perPage, pageIndex * perPage + perPage);
    wonCount.textContent = String(rows.length);
    pageLabel.textContent = "TRANG " + String(pageIndex + 1).padStart(2,"0") + " / " + String(pages).padStart(2,"0");
    paintSizes();
    if(!slice.length){
      board.style.cssText = "display:flex;";
      board.innerHTML = '<div class="empty"><b>CHƯA CÓ KẾT QUẢ</b><span>Các lô trúng sẽ hiện tại đây khi được công bố.</span></div>';
      return;
    }
    board.style.cssText = gridStyle(slice.length);
    board.innerHTML = slice.map((r, i) => {
      const id = maskParts(r.winner_cccd);
      const price = money(r.winning_price_vnd);
      const unit = price === "—" ? "" : "<span>VNĐ</span>";
      return `
      <article class="card" style="animation-delay:${i * 40}ms">
        <div class="card-body">
          <div class="card-top">
            <div class="lot">${esc(r.lot_code || "—")}</div>
            <div class="seal">ĐÃ TRÚNG</div>
          </div>
          <div class="who">${esc(r.winner_name || "—")}</div>
          <div class="cccd"><span class="label">CCCD</span><span>${esc(id.stars)}</span><span class="tail">${esc(id.tail)}</span></div>
        </div>
        <div class="price-band">
          <div class="price-kicker">GIÁ TRÚNG</div>
          <div class="price">${esc(price)}${unit}</div>
        </div>
      </article>`;
    }).join("");
  }
  function go(delta){
    const pages = pageCount();
    pageIndex = (pageIndex + delta + pages) % pages;
    pageStarted = performance.now();
    render();
  }
  async function loadAll(){
    if(!PROJECT_ID || polling) return;
    polling = true;
    const dot = document.getElementById("dot");
    const live = document.getElementById("liveText");
    try{
      const all = [];
      let page = 1;
      let total = 0;
      do{
        const url = `/auction/results/api/projects/${PROJECT_ID}/lots?page=${page}&size=500&result_status=WON`;
        const res = await fetch(url, { headers: { "Accept":"application/json" } });
        const js = await res.json().catch(() => ({}));
        if(!res.ok) throw new Error("http");
        const chunk = Array.isArray(js.data) ? js.data : [];
        total = Number(js.total || chunk.length || 0);
        all.push.apply(all, chunk);
        page += 1;
        if(!chunk.length) break;
      }while(all.length < total && page < 20);
      all.sort((a, b) => Number(a.lot_id || 0) - Number(b.lot_id || 0));
      const next = all.filter(r => String(r.result_status || "").toUpperCase() === "WON" || r.winner_name);
      const sign = list => JSON.stringify(list.map(r => [r.lot_id, r.winner_name, r.winning_price_vnd, digits(r.winner_cccd).slice(-3)]));
      const same = sign(next) === sign(rows);
      rows = next;
      if(!same) render();
      dot.className = "dot";
      const d = new Date();
      const p = n => String(n).padStart(2,"0");
      live.textContent = "Cập nhật " + `${p(d.getHours())}:${p(d.getMinutes())}:${p(d.getSeconds())}`;
    }catch(e){
      dot.className = "dot warn";
      live.textContent = rows.length ? "Mất kết nối · đang giữ kết quả vừa chiếu" : "Mất kết nối";
    }finally{
      polling = false;
    }
  }
  function frame(now){
    const pages = pageCount();
    if(!autoOn || pages < 2){
      pageFill.style.width = autoOn ? "100%" : "0%";
    }else{
      const elapsed = now - pageStarted;
      const limit = seconds * 1000;
      if(elapsed >= limit) go(1);
      else pageFill.style.width = Math.min(100, elapsed / limit * 100) + "%";
    }
    requestAnimationFrame(frame);
  }
  function openControls(open){
    overlay.classList.toggle("open", open);
  }

  document.getElementById("btnPrev").addEventListener("click", () => go(-1));
  document.getElementById("btnNext").addEventListener("click", () => go(1));
  btnAuto.addEventListener("click", () => {
    autoOn = !autoOn;
    pageStarted = performance.now();
    paintAuto();
    saveConfig();
  });
  function setSeconds(v){
    seconds = Math.max(3, Math.min(60, Number(v) || 12));
    secondsInput.value = String(seconds);
    pageStarted = performance.now();
    saveConfig();
  }
  document.getElementById("secDown").addEventListener("click", () => setSeconds(seconds - 1));
  document.getElementById("secUp").addEventListener("click", () => setSeconds(seconds + 1));
  secondsInput.addEventListener("change", () => setSeconds(secondsInput.value));
  sizeButtons.forEach(btn => btn.addEventListener("click", () => {
    perPage = Number(btn.dataset.n);
    pageIndex = 0;
    pageStarted = performance.now();
    paintSizes();
    saveConfig();
    render();
  }));
  async function toggleFull(){
    if(!document.fullscreenElement){
      try{ await document.documentElement.requestFullscreen(); }catch(e){}
    }else{
      try{ await document.exitFullscreen(); }catch(e){}
    }
  }
  document.getElementById("btnFull").addEventListener("click", toggleFull);
  document.getElementById("btnControls").addEventListener("click", () => openControls(true));
  overlay.addEventListener("click", event => {
    if(event.target === overlay) openControls(false);
  });
  document.addEventListener("keydown", event => {
    if(event.key === "Escape") openControls(false);
    if(event.target && (event.target.tagName === "INPUT" || event.target.tagName === "TEXTAREA")) return;
    if(event.key === "ArrowRight") go(1);
    if(event.key === "ArrowLeft") go(-1);
    if(event.key === "f" || event.key === "F") toggleFull();
  });

  loadConfig();
  render();
  loadAll();
  setInterval(loadAll, POLL_MS);
  requestAnimationFrame(frame);
</script>
</body>
</html>
