<!doctype html>
<html lang="vi">
<head>
  <meta charset="utf-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1"/>
  <title>{{ title or "Trình chiếu kết quả trúng đấu giá" }}</title>
  <style>
    :root{
      --bg:#031020;
      --ink:#f5f7fc;
      --muted:#c5d1e1;
      --gold:#f0d38b;
      --line:rgba(212,184,122,.55);
      --font:"Segoe UI","Helvetica Neue",Arial,sans-serif;
      --art-w:400;
      --art-h:312;
    }
    *{box-sizing:border-box}
    html,body{height:100%;margin:0;overflow:hidden;background:var(--bg);color:var(--ink)}
    body{font-family:var(--font)}
    button,input{font-family:inherit;color:inherit}
    button{cursor:pointer}
    button:focus-visible,input:focus-visible{outline:2px solid var(--ink);outline-offset:2px}
    .stage{
      position:relative;
      height:100vh;height:100dvh;
      display:flex;flex-direction:column;
      padding:16px 28px 8px;
      gap:8px;
      background:
        radial-gradient(720px 420px at 10% 0%, rgba(16,82,158,.30), transparent 62%),
        radial-gradient(680px 380px at 90% 8%, rgba(11,66,135,.24), transparent 64%),
        radial-gradient(900px 420px at 50% 100%, rgba(9,49,100,.16), transparent 70%),
        linear-gradient(180deg, #07213d 0%, #031428 46%, #020c18 100%);
      isolation:isolate;
    }
    .stage::before{
      content:"";
      position:absolute;inset:0;pointer-events:none;z-index:0;
      background:
        linear-gradient(115deg, transparent 36%, rgba(90,150,210,.07) 48%, transparent 60%),
        radial-gradient(120% 80% at 50% 40%, transparent 55%, rgba(0,0,0,.28) 100%);
    }
    .frame,.footer{position:relative;z-index:1}
    .frame{
      flex:1 1 auto;min-height:0;
      display:flex;flex-direction:column;gap:8px;
    }
    .header{
      flex:0 0 64px;
      height:64px;
      display:flex;align-items:center;justify-content:space-between;gap:16px;
      border-bottom:1px solid rgba(212,184,122,.28);
    }
    .titles{display:flex;align-items:baseline;gap:14px;min-width:0}
    h1{
      margin:0;
      color:#f4f7fb;
      font-size:15px;
      font-weight:700;
      letter-spacing:.16em;
      line-height:1;
      white-space:nowrap;
    }
    .code{
      color:var(--gold);
      font-size:12px;
      font-weight:700;
      letter-spacing:.14em;
      line-height:1;
      white-space:nowrap;
      padding:4px 8px;
      border:1px solid rgba(212,184,122,.4);
      border-radius:999px;
    }
    .code:empty{display:none}
    .count{
      color:var(--muted);
      font-size:14px;
      font-weight:650;
      letter-spacing:.08em;
      white-space:nowrap;
    }
    .count b{
      color:var(--gold);
      font-size:18px;
      font-weight:750;
      font-variant-numeric:tabular-nums;
      margin-right:6px;
    }
    .board{
      flex:1 1 auto;min-height:0;
      display:grid;gap:16px;
      align-content:stretch;
      opacity:1;
      transition:opacity 300ms linear;
    }
    .board.is-out{opacity:0}
    .card{
      position:relative;
      min-width:0;min-height:0;
      overflow:hidden;
      border-radius:calc(14px * var(--s, 1));
      border:1px solid rgba(214,186,122,.62);
      background:
        radial-gradient(120% 70% at 0% 0%, rgba(40,110,180,.22), transparent 52%),
        linear-gradient(180deg, #092344 0%, #051c34 58%, #03172B 100%);
      box-shadow:
        inset 0 1px 0 rgba(190,220,255,.16),
        0 10px 24px rgba(0,8,20,.28);
    }
    .card::before{
      content:"";
      position:absolute;z-index:2;pointer-events:none;
      top:1px;left:30%;width:40%;height:max(1px, calc(2px * var(--s, 1)));
      background:linear-gradient(90deg, transparent, rgba(232,206,150,.35) 18%, #fff6dc 50%, rgba(232,206,150,.35) 82%, transparent);
      box-shadow:0 0 8px rgba(240,214,160,.35);
    }
    .comp{
      position:absolute;left:50%;top:50%;
      width:400px;height:312px;
      margin-left:-200px;margin-top:-156px;
      transform:scale(var(--s, 0.01));
      transform-origin:center center;
      text-align:center;
    }
    .lot{
      position:absolute;left:22px;width:356px;top:30px;height:66px;
      display:flex;align-items:center;justify-content:center;
      color:#F5F7FC;font-weight:800;font-size:60px;line-height:1.05;letter-spacing:.3px;
      white-space:nowrap;
    }
    .rule{
      position:absolute;left:30px;width:340px;height:1px;
      background:rgba(186,214,240,.22);
    }
    .rule-a{top:112px}
    .rule-b{top:230px}
    .who{
      position:absolute;left:22px;width:356px;top:128px;height:49px;
      display:flex;align-items:center;justify-content:center;
      color:#F3F5FB;font-weight:750;font-size:28px;line-height:1.15;letter-spacing:0;
      overflow:hidden;
    }
    .who.two{
      display:block;
      white-space:normal;
      align-content:center;
    }
    .cccd{
      position:absolute;left:22px;width:356px;top:183px;height:22px;
      display:flex;align-items:center;justify-content:center;gap:8px;
      color:#C5D1E1;font-weight:600;font-size:19px;letter-spacing:2px;
      font-variant-numeric:tabular-nums;
      white-space:nowrap;
    }
    .price{
      position:absolute;left:22px;width:356px;top:244px;height:48px;
      display:flex;align-items:baseline;justify-content:center;
      font-weight:800;font-size:43px;line-height:1;
      font-variant-numeric:tabular-nums;font-feature-settings:"tnum" 1;
      white-space:nowrap;color:#F0D38B;
    }
    .price .group{display:inline-flex;align-items:baseline;gap:6px;white-space:nowrap}
    .price .num{
      background:linear-gradient(180deg,#FFF0BC 0%,#F0D38B 55%,#D8AE5E 100%);
      -webkit-background-clip:text;background-clip:text;
      color:#F0D38B;-webkit-text-fill-color:transparent;
    }
    .price .unit{
      font-size:.349em;font-weight:700;letter-spacing:.04em;color:#E6D3A2;
      -webkit-text-fill-color:#E6D3A2;
    }
    .footer .hud{
      opacity:0;
      pointer-events:none;
      transition:opacity 180ms linear;
    }
    body.hud-on .footer .hud,
    .footer:focus-within .hud{
      opacity:1;
      pointer-events:auto;
    }
    .empty{
      margin:auto;text-align:center;
    }
    .empty b{
      display:block;font-size:clamp(26px, 3vw, 40px);font-weight:750;letter-spacing:.08em;
    }
    .empty span{display:block;margin-top:8px;color:var(--muted);font-size:18px;font-weight:650}
    .footer{
      height:36px;flex:0 0 36px;
      display:grid;grid-template-columns:minmax(0,1fr) auto minmax(0,1fr);
      align-items:center;gap:16px;
      color:var(--muted);font-size:14px;font-weight:650;
    }
    .foot-left,.foot-right{display:flex;align-items:center;gap:10px;min-width:0}
    .foot-right{justify-content:flex-end}
    .dot{width:8px;height:8px;border-radius:50%;background:#3DDC84;flex:0 0 auto}
    .dot.warn{background:#d0d6de}
    .dot.bad{background:#fb7185}
    .conn{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
    .page-nav{display:flex;align-items:center;gap:10px}
    .page-stack{display:flex;flex-direction:column;align-items:center;gap:5px}
    .page-label{letter-spacing:.08em;font-size:13px;font-weight:750;color:var(--ink)}
    .bar{width:148px;height:3px;background:rgba(255,255,255,.12);border-radius:99px;overflow:hidden}
    .bar > span{display:block;height:100%;width:0;background:var(--gold)}
    .btn{
      height:30px;padding:0 10px;
      display:inline-flex;align-items:center;justify-content:center;gap:6px;
      background:transparent;border:1px solid var(--line);border-radius:2px;
      color:var(--ink);font-size:12px;font-weight:750;letter-spacing:.06em;
    }
    .btn svg{width:15px;height:15px;display:block}
    .btn.icon{width:30px;padding:0}
    .btn:disabled{opacity:.35;cursor:default}
    .btn.on{background:var(--gold);color:#1a140c;border-color:var(--gold)}
    .overlay{
      position:fixed;inset:0;z-index:20;display:none;
      justify-content:flex-end;background:rgba(16,18,22,.4);
    }
    .overlay.open{display:flex}
    .drawer{
      width:min(420px, 100%);height:100%;
      background:#102033;
      border-left:1px solid var(--line);
      padding:28px 24px;
      display:flex;flex-direction:column;gap:18px;
    }
    .drawer h2{
      margin:0;font-size:12px;letter-spacing:.2em;color:var(--ink);font-weight:750;
    }
    .field{display:flex;align-items:center;justify-content:space-between;gap:12px;color:var(--muted);font-size:15px;font-weight:650}
    .stepper{display:inline-flex;align-items:center;gap:6px}
    .stepper input{
      width:72px;height:42px;text-align:center;font-size:20px;font-weight:750;
      background:#101216;border:1px solid var(--line);border-radius:2px;color:var(--ink);
    }
    .stepper button,.sizes button{
      height:42px;min-width:42px;
      background:transparent;border:1px solid var(--line);border-radius:2px;
      font-size:18px;font-weight:750;
    }
    .sizes{display:flex;flex-wrap:wrap;gap:8px;justify-content:flex-end;max-width:250px}
    .sizes button.on{background:var(--gold);color:#1a140c;border-color:var(--gold)}
    .hint{color:var(--muted);font-size:13px;line-height:1.45;margin:0}
    @media (prefers-reduced-motion:reduce){
      .board{transition:none}
    }
    @media (max-height:820px){
      .stage{padding:10px 16px 6px;gap:6px}
      .header{flex-basis:52px;height:52px}
      .board{gap:12px}
      .footer{height:34px;flex-basis:34px}
      h1{font-size:13px}
    }
  </style>
</head>
<body>
  <div class="stage">
    <div class="frame">
      <header class="header">
        <div class="titles">
          <h1>KẾT QUẢ TRÚNG ĐẤU GIÁ</h1>
          <div class="code">{{ project or "" }}</div>
        </div>
        <div class="count"><b id="wonCount">0</b> lô trúng</div>
      </header>
      <section class="board d8" id="board"></section>
    </div>
    <footer class="footer">
      <div class="foot-left">
        <span class="dot" id="dot"></span>
        <span class="conn" id="liveText">Đang tải</span>
      </div>
      <div class="page-nav">
        <button class="btn icon hud" type="button" id="btnPrev" aria-label="Trang trước">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><path d="M15 5 8 12l7 7"/></svg>
        </button>
        <div class="page-stack">
          <div class="page-label" id="pageLabel">TRANG 01 / 01</div>
          <div class="bar"><span id="pageFill"></span></div>
        </div>
        <button class="btn icon hud" type="button" id="btnNext" aria-label="Trang sau">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><path d="M9 5l7 7-7 7"/></svg>
        </button>
        <button class="btn on hud" type="button" id="btnAuto" aria-pressed="true">TỰ CHUYỂN</button>
      </div>
      <div class="foot-right">
        <button class="btn hud" type="button" id="btnControls">Điều khiển</button>
        <button class="btn icon hud" type="button" id="btnFull" aria-label="Toàn màn hình">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><path d="M8 4H4v4M16 4h4v4M4 16v4h4M20 16v4h-4"/></svg>
        </button>
      </div>
    </footer>
  </div>

  <div class="overlay" id="overlay">
    <div class="drawer" id="drawer" role="dialog" aria-label="Điều khiển trình chiếu">
      <h2>TRANG CHIẾU</h2>
      <label class="field">Giây mỗi trang
        <span class="stepper">
          <button type="button" id="secDown" aria-label="Giảm thời gian">−</button>
          <input id="seconds" type="number" min="3" max="60" value="12">
          <button type="button" id="secUp" aria-label="Tăng thời gian">+</button>
        </span>
      </label>
      <div class="field">Số lô mỗi trang
        <span class="sizes" id="sizes">
          <button type="button" data-n="4">4</button>
          <button type="button" data-n="6">6</button>
          <button type="button" data-n="8">8</button>
          <button type="button" data-n="12">12</button>
          <button type="button" data-n="16">16</button>
          <button type="button" data-n="20">20</button>
          <button type="button" data-n="24">24</button>
          <button type="button" data-n="30">30</button>
        </span>
      </div>
      <p class="hint">Mặc định 8 lô, 4 cột và 2 hàng. Các mức khác vẫn dùng được. Kết quả cập nhật mỗi 5 giây và giữ nguyên trang đang chiếu.</p>
    </div>
  </div>
<script>
  const PROJECT_ID = {{ project_id or "null" }};
  const POLL_MS = 5000;
  const PAGE_SIZES = [4, 6, 8, 12, 16, 20, 24, 30];
  const storeKey = "results-present:" + String(PROJECT_ID || "none");

  const board = document.getElementById("board");
  const pageLabel = document.getElementById("pageLabel");
  const pageFill = document.getElementById("pageFill");
  const btnAuto = document.getElementById("btnAuto");
  const secondsInput = document.getElementById("seconds");
  const sizeButtons = Array.from(document.querySelectorAll("#sizes button"));
  const overlay = document.getElementById("overlay");
  const wonCount = document.getElementById("wonCount");

  let rows = [];
  let pageIndex = 0;
  let perPage = 8;
  let seconds = 12;
  let autoOn = true;
  let pageStarted = performance.now();
  let polling = false;

  function loadConfig(){
    try{
      const raw = JSON.parse(localStorage.getItem(storeKey) || "{}");
      if(PAGE_SIZES.indexOf(Number(raw.perPage)) >= 0) perPage = Number(raw.perPage);
      const sec = Number(raw.seconds);
      if(sec >= 3 && sec <= 60) seconds = sec;
      if(typeof raw.autoOn === "boolean") autoOn = raw.autoOn;
    }catch(e){}
    secondsInput.value = String(seconds);
    paintAuto();
    paintSizes();
  }
  function saveConfig(){
    try{
      localStorage.setItem(storeKey, JSON.stringify({ perPage, seconds, autoOn }));
    }catch(e){}
  }
  function paintAuto(){
    btnAuto.classList.toggle("on", autoOn);
    btnAuto.textContent = autoOn ? "TỰ CHUYỂN" : "DỪNG TRANG";
    btnAuto.setAttribute("aria-pressed", autoOn ? "true" : "false");
  }
  function paintSizes(){
    sizeButtons.forEach(btn => btn.classList.toggle("on", Number(btn.dataset.n) === perPage));
    PAGE_SIZES.forEach(n => board.classList.remove("d" + n));
    board.classList.add("board", "d" + perPage);
  }
  function digits(v){ return String(v ?? "").replace(/\D/g, ""); }
  function money(v){
    const d = digits(v).replace(/^0+(?=\d)/, "");
    if(!d) return "—";
    let out = "";
    let n = 0;
    for(let i = d.length - 1; i >= 0; i--){
      out = d[i] + out;
      n++;
      if(n % 3 === 0 && i !== 0) out = "." + out;
    }
    return out;
  }
  function maskParts(v){
    const d = digits(v);
    if(!d) return { stars: "", tail: "—" };
    return { stars: "***", tail: d.slice(-3) };
  }
  function esc(s){
    return String(s ?? "")
      .replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;")
      .replace(/"/g,"&quot;");
  }
  function pageCount(){
    return Math.max(1, Math.ceil(rows.length / perPage));
  }
  const BASE_W = 400;
  const BASE_H = 312;
  function chooseGrid(n){
    const gw = board.clientWidth;
    const gh = board.clientHeight;
    const gap = parseFloat(getComputedStyle(board).columnGap) || 16;
    if(gw < 80 || gh < 80){
      const cols = n <= 4 ? 2 : n <= 6 ? 3 : n <= 12 ? 4 : n <= 20 ? 5 : 6;
      return { cols, rowsN: Math.ceil(n / cols) };
    }
    let best = null;
    const maxCols = Math.min(n, 8);
    for(let cols = 1; cols <= maxCols; cols++){
      const rowsN = Math.ceil(n / cols);
      if(rowsN > 8) continue;
      const cellW = (gw - gap * (cols - 1)) / cols;
      const cellH = (gh - gap * (rowsN - 1)) / rowsN;
      if(cellW < 40 || cellH < 40) continue;
      const scale = Math.min(cellW / BASE_W, cellH / BASE_H);
      const waste = cols * rowsN - n;
      const score = scale * 1000 - waste * 12;
      if(!best || score > best.score) best = { cols, rowsN, score };
    }
    return best || { cols: 4, rowsN: Math.ceil(n / 4) };
  }
  function gridStyle(){
    const choice = chooseGrid(perPage);
    board.dataset.cols = String(choice.cols);
    board.dataset.rows = String(choice.rowsN);
    return `grid-template-columns:repeat(${choice.cols}, minmax(0,1fr));grid-template-rows:repeat(${choice.rowsN}, minmax(0,1fr));`;
  }
  function fitShared(selector, base, maxWidth){
    const nodes = Array.from(document.querySelectorAll(selector));
    if(!nodes.length) return;
    nodes.forEach(n => { n.style.fontSize = base + "px"; });
    let worst = 1;
    nodes.forEach(n => {
      const box = n.firstElementChild || n;
      if(box.scrollWidth > maxWidth) worst = Math.max(worst, box.scrollWidth / maxWidth);
    });
    if(worst > 1){
      const size = base / worst;
      nodes.forEach(n => { n.style.fontSize = size + "px"; });
    }
  }
  function fitNames(){
    document.querySelectorAll(".who").forEach(el => {
      el.classList.remove("two");
      el.style.fontSize = "28px";
      el.style.whiteSpace = "nowrap";
      if(el.scrollWidth <= 356) return;
      el.classList.add("two");
      el.style.whiteSpace = "normal";
      let size = 21;
      el.style.fontSize = size + "px";
      let guard = 0;
      while(el.scrollHeight > 49 && size > 14 && guard < 24){
        size -= 0.5;
        el.style.fontSize = size + "px";
        guard += 1;
      }
    });
  }
  function fitContent(){
    fitShared(".lot", 60, 356);
    fitShared(".price", 43, 356);
    fitNames();
  }
  let layoutQueued = false;
  function scheduleLayout(){
    if(layoutQueued) return;
    layoutQueued = true;
    requestAnimationFrame(() => {
      layoutQueued = false;
      layoutNow();
    });
  }
  function layoutNow(){
    const card = board.querySelector(".card");
    if(!card) return;
    const choice = chooseGrid(perPage);
    if(board.dataset.cols !== String(choice.cols) || board.dataset.rows !== String(choice.rowsN)){
      board.dataset.cols = String(choice.cols);
      board.dataset.rows = String(choice.rowsN);
      board.style.gridTemplateColumns = `repeat(${choice.cols}, minmax(0, 1fr))`;
      board.style.gridTemplateRows = `repeat(${choice.rowsN}, minmax(0, 1fr))`;
    }
    const W = card.clientWidth;
    const H = card.clientHeight;
    if(W < 8 || H < 8) return;
    const scale = Math.min(W / BASE_W, H / BASE_H);
    const nextS = scale.toFixed(4);
    if(board.style.getPropertyValue("--s") !== nextS) board.style.setProperty("--s", nextS);
    document.querySelectorAll(".comp").forEach(comp => {
      const next = "scale(" + nextS + ")";
      if(comp.style.transform !== next) comp.style.transform = next;
    });
    fitContent();
  }
  const layoutObserver = new ResizeObserver(() => scheduleLayout());
  layoutObserver.observe(board);
  window.addEventListener("resize", scheduleLayout);
  document.addEventListener("fullscreenchange", scheduleLayout);
  if(document.fonts && document.fonts.ready) document.fonts.ready.then(() => scheduleLayout());
  let shown = false;
  let fadeToken = 0;
  function render(){
    const pages = pageCount();
    if(pageIndex >= pages) pageIndex = pages - 1;
    if(pageIndex < 0) pageIndex = 0;
    const slice = rows.slice(pageIndex * perPage, pageIndex * perPage + perPage);
    const reduce = window.matchMedia("(prefers-reduced-motion: reduce)").matches;
    const apply = () => {
      wonCount.textContent = String(rows.length);
      pageLabel.textContent = "TRANG " + String(pageIndex + 1).padStart(2,"0") + " / " + String(pages).padStart(2,"0");
      paintSizes();
      if(!slice.length){
        board.style.cssText = "display:flex;";
        board.innerHTML = '<div class="empty"><b>CHƯA CÓ KẾT QUẢ</b><span>Các lô trúng sẽ hiện tại đây khi được công bố.</span></div>';
        return;
      }
      board.style.cssText = gridStyle();
      board.innerHTML = slice.map(r => {
        const id = maskParts(r.winner_cccd);
        const price = money(r.winning_price_vnd);
        const unit = price === "—" ? "" : '<span class="unit">VNĐ</span>';
        return `
        <article class="card">
          <div class="comp">
            <div class="lot"><span>${esc(r.lot_code || "—")}</span></div>
            <div class="rule rule-a"></div>
            <div class="who">${esc(r.winner_name || "—")}</div>
            <div class="cccd"><span>${esc(id.stars)}</span><span>${esc(id.tail)}</span></div>
            <div class="rule rule-b"></div>
            <div class="price"><span class="group"><span class="num">${esc(price)}</span>${unit}</span></div>
          </div>
        </article>`;
      }).join("");
      scheduleLayout();
    };
    if(!shown || reduce){
      shown = true;
      apply();
      return;
    }
    const token = ++fadeToken;
    board.classList.add("is-out");
    apply();
    requestAnimationFrame(() => {
      requestAnimationFrame(() => {
        if(token !== fadeToken) return;
        board.classList.remove("is-out");
      });
    });
  }
  function go(delta){
    const pages = pageCount();
    pageIndex = (pageIndex + delta + pages) % pages;
    pageStarted = performance.now();
    render();
  }
  async function loadAll(){
    if(!PROJECT_ID || polling) return;
    polling = true;
    const dot = document.getElementById("dot");
    const live = document.getElementById("liveText");
    try{
      const all = [];
      let page = 1;
      let total = 0;
      do{
        const url = `/auction/results/api/projects/${PROJECT_ID}/lots?page=${page}&size=500&result_status=WON`;
        const res = await fetch(url, { headers: { "Accept":"application/json" } });
        const js = await res.json().catch(() => ({}));
        if(!res.ok) throw new Error("http");
        const chunk = Array.isArray(js.data) ? js.data : [];
        total = Number(js.total || chunk.length || 0);
        all.push.apply(all, chunk);
        page += 1;
        if(!chunk.length) break;
      }while(all.length < total && page < 20);
      all.sort((a, b) => Number(a.lot_id || 0) - Number(b.lot_id || 0));
      const next = all.filter(r => String(r.result_status || "").toUpperCase() === "WON" || r.winner_name);
      const sign = list => JSON.stringify(list.map(r => [r.lot_id, r.winner_name, r.winning_price_vnd, digits(r.winner_cccd).slice(-3)]));
      const same = sign(next) === sign(rows);
      rows = next;
      if(!same) render();
      dot.className = "dot";
      const d = new Date();
      const p = n => String(n).padStart(2,"0");
      live.textContent = "Cập nhật " + `${p(d.getHours())}:${p(d.getMinutes())}:${p(d.getSeconds())}`;
    }catch(e){
      dot.className = "dot warn";
      live.textContent = rows.length ? "Mất kết nối · đang giữ kết quả vừa chiếu" : "Mất kết nối";
    }finally{
      polling = false;
    }
  }
  function frame(now){
    const pages = pageCount();
    if(!autoOn || pages < 2){
      pageFill.style.width = autoOn ? "100%" : "0%";
    }else{
      const elapsed = now - pageStarted;
      const limit = seconds * 1000;
      if(elapsed >= limit) go(1);
      else pageFill.style.width = Math.min(100, elapsed / limit * 100) + "%";
    }
    requestAnimationFrame(frame);
  }
  function openControls(open){
    overlay.classList.toggle("open", open);
  }

  document.getElementById("btnPrev").addEventListener("click", () => go(-1));
  document.getElementById("btnNext").addEventListener("click", () => go(1));
  btnAuto.addEventListener("click", () => {
    autoOn = !autoOn;
    pageStarted = performance.now();
    paintAuto();
    saveConfig();
  });
  function setSeconds(v){
    seconds = Math.max(3, Math.min(60, Number(v) || 12));
    secondsInput.value = String(seconds);
    pageStarted = performance.now();
    saveConfig();
  }
  document.getElementById("secDown").addEventListener("click", () => setSeconds(seconds - 1));
  document.getElementById("secUp").addEventListener("click", () => setSeconds(seconds + 1));
  secondsInput.addEventListener("change", () => setSeconds(secondsInput.value));
  sizeButtons.forEach(btn => btn.addEventListener("click", () => {
    perPage = Number(btn.dataset.n);
    pageIndex = 0;
    pageStarted = performance.now();
    paintSizes();
    saveConfig();
    render();
  }));
  async function toggleFull(){
    if(!document.fullscreenElement){
      try{ await document.documentElement.requestFullscreen(); }catch(e){}
    }else{
      try{ await document.exitFullscreen(); }catch(e){}
    }
  }
  document.getElementById("btnFull").addEventListener("click", toggleFull);
  document.getElementById("btnControls").addEventListener("click", () => openControls(true));
  overlay.addEventListener("click", event => {
    if(event.target === overlay) openControls(false);
  });
  const footer = document.querySelector(".footer");
  let hudTimer = 0;
  function armHide(){
    clearTimeout(hudTimer);
    hudTimer = setTimeout(() => {
      const focused = footer.contains(document.activeElement);
      if(focused || footer.matches(":hover") || overlay.classList.contains("open")){
        armHide();
        return;
      }
      document.body.classList.remove("hud-on");
    }, 2800);
  }
  function revealHud(){
    document.body.classList.add("hud-on");
    armHide();
  }
  document.addEventListener("mousemove", revealHud);
  footer.addEventListener("focusin", revealHud);
  document.addEventListener("keydown", event => {
    revealHud();
    if(event.key === "Escape") openControls(false);
    if(event.target && (event.target.tagName === "INPUT" || event.target.tagName === "TEXTAREA")) return;
    if(event.key === "ArrowRight") go(1);
    if(event.key === "ArrowLeft") go(-1);
    if(event.key === "f" || event.key === "F") toggleFull();
  });

  loadConfig();
  render();
  loadAll();
  setInterval(loadAll, POLL_MS);
  requestAnimationFrame(frame);
</script>
</body>
</html>
